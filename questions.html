<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Questions — Breathe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@300;400&display=swap');
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #0f0f0f;
    color: #eee;
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
 
  /* thin progress line at top */
  .progress-bar {
    height: 3px;
    background: #222;
  }
  .progress-fill {
    height: 100%;
    background: #666;
    transition: width 0.4s;
    width: 0%;
  }
 
  /* small info row */
  .topbar {
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #555;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
 
  /* middle area where question lives */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 32px;
    gap: 36px;
  }
 
  .question {
    font-family: 'Caveat', cursive;
    font-size: clamp(24px, 4vw, 42px);
    text-align: center;
    line-height: 1.4;
    max-width: 540px;
    color: #eee;
  }
 
  /* slider */
  .slider-wrap {
    width: min(480px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
 
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: #333;
    outline: none;
    cursor: pointer;
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #eee;
    cursor: grab;
  }
  input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; }
 
  .labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
 
  /* small feedback text */
  .feedback {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: #666;
    text-align: center;
    min-height: 28px;
  }
 
  /* bottom nav */
  .nav {
    padding: 16px 24px 24px;
    display: flex;
    justify-content: space-between;
  }
 
  button {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 22px;
    color: #aaa;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #222; color: #eee; }
</style>
</head>
<body>
 
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
 
  <div class="topbar">
    <span id="topic">—</span>
    <span id="count">1 / 12</span>
  </div>
 
  <div class="stage">
    <p class="question" id="question">Loading...</p>
    <div class="slider-wrap">
      <input type="range" min="0" max="100" value="50" id="slider" />
      <div class="labels"><span>Strongly Disagree</span><span>Strongly Agree</span></div>
    </div>
    <p class="feedback" id="feedback"></p>
  </div>
 
  <div class="nav">
    <button id="prevBtn">← Back</button>
    <button id="nextBtn">Next →</button>
  </div>
 
<script>
  var QUESTIONS = [
    { id:'q1',  topic:'Mood',      text:'I have felt hopeful about the future recently.',          inv:false },
    { id:'q2',  topic:'Mood',      text:'I have been feeling low or empty without knowing why.',   inv:true  },
    { id:'q3',  topic:'Mood',      text:'Small things have been bringing me joy lately.',           inv:false },
    { id:'q4',  topic:'Anxiety',   text:'I have felt calm and at ease in my daily life.',           inv:false },
    { id:'q5',  topic:'Anxiety',   text:'My mind has been racing with worries I cannot control.',  inv:true  },
    { id:'q6',  topic:'Anxiety',   text:'I have been able to relax when I needed to.',             inv:false },
    { id:'q7',  topic:'Sleep',     text:'I have been waking up feeling rested and restored.',      inv:false },
    { id:'q8',  topic:'Sleep',     text:'I have struggled to fall or stay asleep recently.',       inv:true  },
    { id:'q9',  topic:'Social',    text:'I have felt genuinely connected to people around me.',    inv:false },
    { id:'q10', topic:'Social',    text:'I have felt lonely or isolated, even around others.',     inv:true  },
    { id:'q11', topic:'Self',      text:'I have been kind and patient with myself.',               inv:false },
    { id:'q12', topic:'Self',      text:'I have been critical of myself more than I deserve.',     inv:true  },
  ];
 
  var FB_HIGH = ["That's good to hear.", "Hold onto that.", "You're doing better than you think."];
  var FB_MID  = ["That's honest.", "In-between is a real place to be.", "That ambivalence is valid."];
  var FB_LOW  = ["Thank you for being honest.", "You're not alone in this.", "That takes courage to acknowledge."];
 
  var responses = {};
  try { responses = JSON.parse(localStorage.getItem('bth_resp')) || {}; } catch(e) {}
 
  var cur = 0;
  var fbTimer;
 
  var questionEl = document.getElementById('question');
  var topicEl    = document.getElementById('topic');
  var countEl    = document.getElementById('count');
  var fillEl     = document.getElementById('fill');
  var slider     = document.getElementById('slider');
  var feedbackEl = document.getElementById('feedback');
  var prevBtn    = document.getElementById('prevBtn');
  var nextBtn    = document.getElementById('nextBtn');
 
  function render() {
    var q = QUESTIONS[cur];
    questionEl.textContent = q.text;
    topicEl.textContent = q.topic;
    countEl.textContent = (cur + 1) + ' / ' + QUESTIONS.length;
    fillEl.style.width = ((cur + 1) / QUESTIONS.length * 100) + '%';
    slider.value = responses[q.id] !== undefined ? responses[q.id] : 50;
    feedbackEl.textContent = '';
    prevBtn.style.opacity = cur === 0 ? '0.3' : '1';
    prevBtn.disabled = cur === 0;
    nextBtn.textContent = cur === QUESTIONS.length - 1 ? 'See Results →' : 'Next →';
  }
 
  slider.addEventListener('input', function() {
    var val = parseInt(slider.value);
    responses[QUESTIONS[cur].id] = val;
    try { localStorage.setItem('bth_resp', JSON.stringify(responses)); } catch(e) {}
 
    var display = QUESTIONS[cur].inv ? 100 - val : val;
    var pool = display >= 65 ? FB_HIGH : display >= 35 ? FB_MID : FB_LOW;
    feedbackEl.textContent = pool[Math.floor(Math.random() * pool.length)];
    clearTimeout(fbTimer);
    fbTimer = setTimeout(function() { feedbackEl.textContent = ''; }, 3000);
  });
 
  nextBtn.addEventListener('click', function() {
    if (cur < QUESTIONS.length - 1) {
      cur++;
      render();
    } else {
      try { localStorage.setItem('bth_resp', JSON.stringify(responses)); } catch(e) {}
      window.location.href = 'results.html';
    }
  });
 
  prevBtn.addEventListener('click', function() {
    if (cur > 0) { cur--; render(); }
  });
 
  render();
</script>
</body>
</html>
