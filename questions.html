<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Questions — Breathe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Lora:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400&display=swap');

/* ── Variables ── */
:root {
  --bg: #0e0e0e;
  --text: #f0ede8;
  --text2: #b0aca6;
  --muted: #585858;
  --surface: #1c1c1c;
  --border: #2c2c2c;
  --border2: #3a3a3a;
  --font-display: 'Caveat', cursive;
  --font-body: 'Lora', serif;
  --font-ui: 'DM Sans', sans-serif;
}
[data-theme="light"] {
  --bg: #f4f1ec;
  --text: #1c1a17;
  --text2: #56524d;
  --muted: #9a9590;
  --surface: #e6e1da;
  --border: #ccc7bf;
  --border2: #b5b0a8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  display: flex;
  flex-direction: column;
  transition: background 0.4s, color 0.4s;
}

/* ── Theme toggle ── */
.theme-btn {
  position: fixed;
  top: 20px;
  right: 24px;
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 300;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  z-index: 10;
}
.theme-btn:hover { color: var(--text2); }

/* ── Progress bar at top ── */
.progress-bar {
  height: 2px;
  background: var(--border);
  flex-shrink: 0;
}
.progress-fill {
  height: 100%;
  background: var(--text2);
  border-radius: 999px;
  transition: width 0.5s ease;
  width: 0%;
}

/* ── Top bar: topic + question number ── */
.top-bar {
  padding: 18px 32px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.topic-tag {
  font-size: 10px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.q-count {
  font-size: 10px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.06em;
}

/* ── Question card area ── */
/* The stage holds all cards stacked on each other */
.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.card {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 48px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
/* .active makes a card fully visible */
.card.active {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}
/* .exit slides the card up and out */
.card.exit {
  opacity: 0;
  transform: translateY(-40px);
  pointer-events: none;
}

.question-text {
  font-family: var(--font-display);
  font-size: clamp(22px, 3.5vw, 40px);
  font-weight: 400;
  text-align: center;
  line-height: 1.4;
  color: var(--text);
  max-width: 560px;
  margin-bottom: 48px;
}

/* ── Slider ── */
.slider-wrap {
  width: min(500px, 88vw);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: var(--border2);
  border-radius: 999px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--text);
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1.5px var(--border2);
  cursor: grab;
  transition: transform 0.2s;
}
input[type="range"]:active::-webkit-slider-thumb {
  transform: scale(1.2);
  cursor: grabbing;
}

.slider-labels {
  display: flex;
  justify-content: space-between;
}
.slider-labels span {
  font-size: 10px;
  font-weight: 300;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

/* ── Feedback line ── */
/* Shows a gentle response when the user moves the slider */
.feedback {
  margin: 0 32px 10px;
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--text2);
  text-align: center;
  min-height: 48px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.feedback.visible { opacity: 1; }

/* ── Footer: prev/next buttons ── */
.footer {
  padding: 0 32px 24px;
  display: flex;
  justify-content: space-between;
  flex-shrink: 0;
}

.btn {
  padding: 10px 22px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 300;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn:hover { background: var(--border2); color: var(--text); }

/* ── Fade out on navigate ── */
body.fade-out { animation: fadeOut 0.5s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>

  <button class="theme-btn" id="themeBtn">Light / Dark</button>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="top-bar">
    <span class="topic-tag" id="topicTag">—</span>
    <span class="q-count" id="qCount">1 / 12</span>
  </div>

  <!-- Cards are injected here by JS -->
  <div class="stage" id="stage"></div>

  <!-- Feedback appears here after slider move -->
  <div class="feedback" id="feedback"></div>

  <div class="footer">
    <button class="btn" id="prevBtn">← Back</button>
    <button class="btn" id="nextBtn">Next →</button>
  </div>

<script>
(function () {

  // ── Theme ──
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  root.setAttribute('data-theme', localStorage.getItem('bth_theme') || 'dark');
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('bth_theme', next);
  });


  // ── Questions data ──
  // Each question has: an id (used to save the answer), a topic group, 
  // the text, and inv (inverted) - meaning "strongly agree" is actually a BAD sign
  var QUESTIONS = [
    { id: 'q1',  topic: 'mood',    text: 'I have felt hopeful about the future recently.',         inv: false },
    { id: 'q2',  topic: 'mood',    text: 'I have been feeling low or empty without knowing why.',  inv: true  },
    { id: 'q3',  topic: 'mood',    text: 'Small things have been bringing me joy lately.',          inv: false },
    { id: 'q4',  topic: 'anxiety', text: 'I have felt calm and at ease in my daily life.',          inv: false },
    { id: 'q5',  topic: 'anxiety', text: 'My mind has been racing with worries I cannot control.', inv: true  },
    { id: 'q6',  topic: 'anxiety', text: 'I have been able to relax when I needed to.',            inv: false },
    { id: 'q7',  topic: 'sleep',   text: 'I have been waking up feeling rested and restored.',     inv: false },
    { id: 'q8',  topic: 'sleep',   text: 'I have struggled to fall or stay asleep recently.',      inv: true  },
    { id: 'q9',  topic: 'social',  text: 'I have felt genuinely connected to people around me.',   inv: false },
    { id: 'q10', topic: 'social',  text: 'I have felt lonely or isolated, even around others.',    inv: true  },
    { id: 'q11', topic: 'self',    text: 'I have been kind and patient with myself.',              inv: false },
    { id: 'q12', topic: 'self',    text: 'I have been critical of myself more than I deserve.',    inv: true  },
  ];

  var TOPIC_LABELS = {
    mood:    '🌤  Emotional Wellbeing',
    anxiety: '🌊  Anxiety & Stress',
    sleep:   '🌙  Sleep & Energy',
    social:  '🤝  Connection',
    self:    '🌱  Self-Worth',
  };

  // Gentle responses based on where the slider lands
  var FB_HIGH = ["That's really good to hear.", "Hold onto that.", "You're doing better than you think."];
  var FB_MID  = ["Somewhere in the middle is honest.", "That ambivalence is valid.", "In-between is a real place to be."];
  var FB_LOW  = ["Thank you for being honest with yourself.", "That takes courage to acknowledge.", "You're not alone in feeling this way."];

  function getFeedback(displayValue) {
    var pool = displayValue >= 65 ? FB_HIGH : displayValue >= 35 ? FB_MID : FB_LOW;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ── Load previously saved answers (so sliders remember position) ──
  var responses = {};
  try { responses = JSON.parse(localStorage.getItem('bth_resp')) || {}; } catch (e) {}

  // ── Build the cards ──
  var stage      = document.getElementById('stage');
  var feedback   = document.getElementById('feedback');
  var progressFill = document.getElementById('progressFill');
  var topicTag   = document.getElementById('topicTag');
  var qCount     = document.getElementById('qCount');
  var prevBtn    = document.getElementById('prevBtn');
  var nextBtn    = document.getElementById('nextBtn');

  var currentIndex = 0;
  var fbTimeout;

  QUESTIONS.forEach(function (q, i) {
    var card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' active' : '');
    card.id = 'card-' + i;

    // Default to 50 if no saved answer
    var savedValue = responses[q.id] !== undefined ? responses[q.id] : 50;

    card.innerHTML =
      '<p class="question-text">' + q.text + '</p>' +
      '<div class="slider-wrap">' +
        '<input type="range" min="0" max="100" value="' + savedValue + '" id="slider-' + i + '" />' +
        '<div class="slider-labels"><span>Strongly Disagree</span><span>Strongly Agree</span></div>' +
      '</div>';

    stage.appendChild(card);

    // When slider moves: save answer + show feedback
    var slider = card.querySelector('input');
    slider.addEventListener('input', function () {
      var val = parseInt(slider.value);
      responses[q.id] = val;
      try { localStorage.setItem('bth_resp', JSON.stringify(responses)); } catch (e) {}

      // For inverted questions, flip for display purposes
      var displayVal = q.inv ? 100 - val : val;
      feedback.textContent = getFeedback(displayVal);
      feedback.classList.add('visible');

      clearTimeout(fbTimeout);
      fbTimeout = setTimeout(function () { feedback.classList.remove('visible'); }, 3000);
    });
  });


  // ── Update header info and buttons for current card ──
  function updateHeader() {
    var q = QUESTIONS[currentIndex];
    topicTag.textContent = TOPIC_LABELS[q.topic];
    qCount.textContent = (currentIndex + 1) + ' / ' + QUESTIONS.length;
    progressFill.style.width = (((currentIndex + 1) / QUESTIONS.length) * 100) + '%';
    prevBtn.style.opacity = currentIndex === 0 ? '0.3' : '1';
    prevBtn.style.pointerEvents = currentIndex === 0 ? 'none' : 'auto';
    nextBtn.textContent = currentIndex === QUESTIONS.length - 1 ? 'See Results →' : 'Next →';
  }


  // ── Switch cards ──
  function goTo(newIndex) {
    var oldCard = document.getElementById('card-' + currentIndex);
    var newCard = document.getElementById('card-' + newIndex);

    oldCard.classList.remove('active');
    oldCard.classList.add('exit');

    // Remove exit class after animation finishes
    setTimeout(function () { oldCard.classList.remove('exit'); }, 500);

    newCard.classList.add('active');
    currentIndex = newIndex;
    updateHeader();
    feedback.classList.remove('visible');
  }


  // ── Button events ──
  nextBtn.addEventListener('click', function () {
    if (currentIndex < QUESTIONS.length - 1) {
      goTo(currentIndex + 1);
    } else {
      // Last question → save and go to results
      try { localStorage.setItem('bth_resp', JSON.stringify(responses)); } catch (e) {}
      document.body.classList.add('fade-out');
      setTimeout(function () { window.location.href = 'results.html'; }, 500);
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentIndex > 0) goTo(currentIndex - 1);
  });


  // ── Swipe support on mobile ──
  var touchStartY = 0;
  stage.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var diff = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diff) > 50) {
      if (diff > 0 && currentIndex < QUESTIONS.length - 1) goTo(currentIndex + 1);
      if (diff < 0 && currentIndex > 0) goTo(currentIndex - 1);
    }
  });


  // ── Init ──
  updateHeader();

})();
</script>
</body>
</html>
