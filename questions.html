<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Questions — Breathe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500&display=swap');
:root{--bg:#10100f;--bg2:#171715;--surface:rgba(28,28,26,.82);--surface2:rgba(38,38,35,.96);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#f3efe9;--text2:#cbc4ba;--muted:#8c857b;--accent:#eaded0;--shadow:0 26px 90px rgba(0,0,0,.32);--font-display:'Caveat',cursive;--font-body:'Lora',serif;--font-ui:'DM Sans',sans-serif;--pill:999px;--dur:.55s;--ease:cubic-bezier(.22,1,.36,1);}
[data-theme="light"]{--bg:#f4f0e8;--bg2:#ebe4d9;--surface:rgba(255,255,255,.72);--surface2:rgba(248,243,235,.94);--border:rgba(46,37,28,.09);--border2:rgba(46,37,28,.16);--text:#1f1a16;--text2:#5e554d;--muted:#8e8479;--accent:#342c26;--shadow:0 26px 90px rgba(87,68,41,.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{overflow:hidden;background:
radial-gradient(circle at top, rgba(197,174,153,.12), transparent 32%),
radial-gradient(circle at bottom left, rgba(116,154,136,.12), transparent 28%),
linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);font-family:var(--font-ui);transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 18% 22%, rgba(255,255,255,.05), transparent 24%),
radial-gradient(circle at 78% 78%, rgba(255,255,255,.04), transparent 20%);}
.page{position:fixed;inset:0;padding:22px;display:flex;justify-content:center;align-items:center;}
.shell{position:relative;width:min(980px,100%);height:min(760px,100%);padding:24px;border:1px solid var(--border);border-radius:34px;background:var(--surface);backdrop-filter:blur(22px);box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto auto;gap:18px;}
.theme-ctrl{position:absolute;top:22px;right:22px;z-index:20;display:inline-flex;align-items:center;gap:10px;background:transparent;border:none;color:inherit;cursor:pointer;font:inherit;}
.theme-lbl{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}
.tog{position:relative;width:46px;height:24px;background:var(--surface2);border-radius:var(--pill);border:1px solid var(--border2);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text2);transition:transform .45s var(--ease),background var(--dur) var(--ease);}
[data-theme="light"] .tog::after{transform:translateX(22px);}
.topbar{padding-right:92px;display:flex;flex-direction:column;gap:16px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--pill);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.q-num{font-size:11px;letter-spacing:.08em;color:var(--muted);}
.progress{height:4px;background:rgba(255,255,255,.05);border-radius:var(--pill);overflow:hidden;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#c58a87,#aeb09a,#7eb091);border-radius:inherit;transition:width .7s var(--ease);}
.intro{display:grid;gap:8px;padding-top:10px;}
.hello{font-family:var(--font-display);font-size:clamp(28px,4vw,46px);line-height:1;}
.support-line{font-family:var(--font-body);font-size:17px;line-height:1.65;color:var(--text2);max-width:720px;}
.stage{position:relative;overflow:hidden;min-height:clamp(280px,42vh,420px);}
.card{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:28px;padding:12px 8px;opacity:0;pointer-events:none;transform:translate3d(0,42px,0) scale(.985);filter:blur(10px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease);}
.card.active{opacity:1;pointer-events:auto;transform:translate3d(0,0,0) scale(1);filter:blur(0);}
.card.leaving-forward{opacity:0;transform:translate3d(0,-38px,0) scale(.985);}
.card.leaving-backward{opacity:0;transform:translate3d(0,38px,0) scale(.985);}
.card.entering-forward{transform:translate3d(0,42px,0) scale(.985);}
.card.entering-backward{transform:translate3d(0,-42px,0) scale(.985);}
.question-wrap{width:min(720px,100%);display:grid;gap:22px;}
.q-text{font-family:var(--font-display);font-size:clamp(28px,4.6vw,54px);line-height:1.12;text-align:center;letter-spacing:-.02em;}
.slider-shell{display:grid;gap:14px;padding:22px 22px 18px;border:1px solid var(--border);border-radius:28px;background:var(--surface2);}
.slider-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.scale-note{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.value-pill{min-width:128px;padding:10px 14px;border-radius:var(--pill);background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:12px;letter-spacing:.05em;text-align:center;color:var(--text2);transition:background .3s var(--ease),color .3s var(--ease),transform .3s var(--ease);}
.value-pill.is-live{transform:translateY(-1px);color:var(--text);}
.slider-track{position:relative;padding:12px 0 6px;}
.slider-track::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);background:linear-gradient(90deg,rgba(197,138,135,.85),rgba(203,196,186,.4),rgba(126,176,145,.85));border-radius:var(--pill);opacity:.65;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;position:relative;z-index:1;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:transparent;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--text);border:2px solid var(--surface2);box-shadow:0 0 0 1px var(--border2),0 10px 18px rgba(0,0,0,.2);transition:transform .2s var(--ease),background .3s var(--ease);}
input[type=range]::-moz-range-track{height:2px;background:transparent;}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:2px solid var(--surface2);box-shadow:0 0 0 1px var(--border2),0 10px 18px rgba(0,0,0,.2);transition:transform .2s var(--ease),background .3s var(--ease);}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18);}
input[type=range]:active::-moz-range-thumb{transform:scale(1.18);}
.labels{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);}
.labels span:last-child{text-align:right;}
.response{min-height:74px;padding:16px 18px;border:1px solid var(--border);border-radius:22px;background:rgba(255,255,255,.025);font-family:var(--font-body);font-size:16px;line-height:1.7;color:var(--text2);transition:opacity .35s var(--ease),transform .35s var(--ease),border-color .35s var(--ease);}
.response.visible{opacity:1;transform:none;}
.response strong{color:var(--text);font-weight:500;}
.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.helper{font-size:12px;color:var(--muted);}
.actions{display:flex;gap:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--pill);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font-ui);font-size:13px;font-weight:400;letter-spacing:.04em;cursor:pointer;transition:transform .22s var(--ease),opacity .3s var(--ease),background .3s var(--ease);}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(1px) scale(.985);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.page-enter{animation:pageIn .72s var(--ease) both;}
.page-exit{animation:pageOut .58s cubic-bezier(.4,0,.2,1) both;}
@keyframes pageIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pageOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-26px)}}
@media (max-width:820px){
  .page{padding:12px;}
  .shell{height:100%;padding:18px;border-radius:26px;}
  .topbar{padding-right:0;padding-top:48px;}
  .row,.footer,.slider-top{flex-direction:column;align-items:stretch;}
  .actions{justify-content:space-between;}
  .btn{flex:1;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body class="page-enter">
<div class="page">
  <main class="shell">
    <button class="theme-ctrl" id="themeCtrl" type="button" aria-label="Toggle theme">
      <span class="theme-lbl" id="themeLbl">Dark</span>
      <span class="tog" aria-hidden="true"></span>
    </button>

    <section class="topbar">
      <div class="row">
        <div class="tag" id="topicTag">Emotional Wellbeing</div>
        <div class="q-num" id="qNum">1 / 12</div>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progFill"></div></div>
      <div class="intro">
        <p class="hello" id="helloLine">Let’s check in.</p>
        <p class="support-line" id="supportLine">Slide to whatever feels most true today. There is no right answer here.</p>
      </div>
    </section>

    <section class="stage" id="stage" aria-live="polite"></section>

    <div class="response" id="responseBox"></div>

    <footer class="footer">
      <p class="helper">Use the slider, arrow keys, or swipe up and down.</p>
      <div class="actions">
        <button class="btn" id="prevBtn" type="button">← Back</button>
        <button class="btn" id="nextBtn" type="button">Next →</button>
      </div>
    </footer>
  </main>
</div>

<script>
(function(){
  var root = document.documentElement;
  var themeCtrl = document.getElementById('themeCtrl');
  var themeLbl = document.getElementById('themeLbl');
  var stage = document.getElementById('stage');
  var progFill = document.getElementById('progFill');
  var topicTag = document.getElementById('topicTag');
  var qNum = document.getElementById('qNum');
  var responseBox = document.getElementById('responseBox');
  var nextBtn = document.getElementById('nextBtn');
  var prevBtn = document.getElementById('prevBtn');
  var helloLine = document.getElementById('helloLine');
  var supportLine = document.getElementById('supportLine');
  var name = localStorage.getItem('bth_name') || 'friend';

  var QUESTIONS = [
    {id:'q1', topic:'mood', text:'I have felt hopeful about the future recently.', inv:false},
    {id:'q2', topic:'mood', text:'I have been feeling low or empty without knowing why.', inv:true},
    {id:'q3', topic:'mood', text:'Small things have been bringing me joy lately.', inv:false},
    {id:'q4', topic:'anxiety', text:'I have felt calm and at ease in my daily life.', inv:false},
    {id:'q5', topic:'anxiety', text:'My mind has been racing with worries I cannot control.', inv:true},
    {id:'q6', topic:'anxiety', text:'I have been able to relax when I needed to.', inv:false},
    {id:'q7', topic:'sleep', text:'I have been waking up feeling rested and restored.', inv:false},
    {id:'q8', topic:'sleep', text:'I have struggled to fall or stay asleep recently.', inv:true},
    {id:'q9', topic:'social', text:'I have felt genuinely connected to people around me.', inv:false},
    {id:'q10', topic:'social', text:'I have felt lonely or isolated, even around others.', inv:true},
    {id:'q11', topic:'self', text:'I have been kind and patient with myself.', inv:false},
    {id:'q12', topic:'self', text:'I have been critical of myself more than I deserve.', inv:true}
  ];

  var TOPICS = {
    mood:{label:'Emotional Wellbeing', icon:'☼', support:'This part is about energy, hope, and the emotional tone of your days.'},
    anxiety:{label:'Anxiety & Stress', icon:'◌', support:'Notice your nervous system here: steadiness, worry, pressure, and ease.'},
    sleep:{label:'Sleep & Energy', icon:'☾', support:'Think about rest, recovery, and whether your body feels replenished.'},
    social:{label:'Connection', icon:'∞', support:'This section looks at closeness, loneliness, and feeling understood.'},
    self:{label:'Self-Worth', icon:'✦', support:'These answers reflect how gently or harshly you have been treating yourself.'}
  };

  var RESPONSES = loadJSON('bth_resp', {});
  var TOUCHED = loadJSON('bth_touched', {});
  var cards = [];
  var current = 0;
  var locked = false;
  var touchY = 0;

  var REFLECTIONS = {
    mood:{
      low:'Things may feel heavy right now. <strong>Thank you for being honest</strong> instead of forcing a brighter answer.',
      mid:'This sounds mixed, which is a real place to be. <strong>You do not need to be all-good or all-bad</strong> to answer truthfully.',
      high:'There is some light here. <strong>That steadier feeling matters</strong>, even if it comes in small moments.'
    },
    anxiety:{
      low:'Your answer suggests more tension than calm. <strong>Let the next breath be slower than the last</strong> if you can.',
      mid:'It sounds like you are carrying some pressure, but not all the way under it. <strong>That middle ground still deserves care</strong>.',
      high:'There is a bit of room to breathe here. <strong>Notice what helps you feel settled</strong> so you can come back to it.'
    },
    sleep:{
      low:'Rest may not be coming easily. <strong>Poor sleep can color everything</strong>, so this answer is important.',
      mid:'Your rest sounds inconsistent. <strong>Even uneven sleep is worth paying attention to</strong>, not brushing off.',
      high:'Your body seems to be getting some recovery. <strong>Protect the habits that are supporting that</strong>.'
    },
    social:{
      low:'You may be feeling more alone than you want to be. <strong>That ache is real</strong>, even if nobody else sees it.',
      mid:'Connection feels present but not fully nourishing. <strong>That gap is useful information</strong>, not failure.',
      high:'There is warmth in your connections. <strong>Being known by others is a real protective force</strong>.'
    },
    self:{
      low:'You may be carrying a sharp inner voice lately. <strong>You deserve more gentleness than that</strong>.',
      mid:'Your self-view sounds mixed right now. <strong>There may be room for more softness</strong> in how you talk to yourself.',
      high:'There is some self-compassion here. <strong>That is strength, not indulgence</strong>.'
    }
  };

  var SCALE_LABELS = [
    {max:15, label:'Not at all true'},
    {max:35, label:'A little true'},
    {max:65, label:'Somewhat true'},
    {max:85, label:'Mostly true'},
    {max:100, label:'Very true'}
  ];

  function loadJSON(key, fallback){
    try{
      var value = JSON.parse(localStorage.getItem(key));
      return value && typeof value === 'object' ? value : fallback;
    }catch(e){
      return fallback;
    }
  }

  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  function setTheme(theme){
    root.setAttribute('data-theme', theme);
    themeLbl.textContent = theme === 'dark' ? 'Dark' : 'Light';
    try{ localStorage.setItem('bth_theme', theme); }catch(e){}
  }

  setTheme(localStorage.getItem('bth_theme') || 'dark');
  themeCtrl.addEventListener('click', function(){
    setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  function scaleLabel(value){
    for(var i = 0; i < SCALE_LABELS.length; i += 1){
      if(value <= SCALE_LABELS[i].max){ return SCALE_LABELS[i].label; }
    }
    return SCALE_LABELS[SCALE_LABELS.length - 1].label;
  }

  function reflectionFor(question, rawValue){
    var adjusted = question.inv ? 100 - rawValue : rawValue;
    var band = adjusted >= 70 ? 'high' : adjusted >= 35 ? 'mid' : 'low';
    return REFLECTIONS[question.topic][band];
  }

  function buildCards(){
    QUESTIONS.forEach(function(question, index){
      var value = RESPONSES[question.id] !== undefined ? Number(RESPONSES[question.id]) : 50;
      var card = document.createElement('section');
      card.className = 'card' + (index === 0 ? ' active' : '');
      card.id = 'card-' + index;
      card.innerHTML =
        '<div class="question-wrap">' +
          '<p class="q-text">' + question.text + '</p>' +
          '<div class="slider-shell">' +
            '<div class="slider-top">' +
              '<span class="scale-note">Move gently, answer honestly</span>' +
              '<span class="value-pill" id="value-pill-' + index + '">' + scaleLabel(value) + '</span>' +
            '</div>' +
            '<div class="slider-track">' +
              '<input type="range" min="0" max="100" step="1" value="' + value + '" id="slider-' + index + '" aria-label="' + question.text + '">' +
            '</div>' +
            '<div class="labels"><span>Disagree</span><span>Agree</span></div>' +
          '</div>' +
        '</div>';
      stage.appendChild(card);
      cards.push(card);

      var slider = card.querySelector('input');
      var pill = card.querySelector('.value-pill');
      slider.addEventListener('input', function(){
        var sliderValue = Number(slider.value);
        RESPONSES[question.id] = sliderValue;
        TOUCHED[question.id] = true;
        pill.textContent = scaleLabel(sliderValue);
        pill.classList.add('is-live');
        responseBox.innerHTML = reflectionFor(question, sliderValue);
        responseBox.classList.add('visible');
        saveJSON('bth_resp', RESPONSES);
        saveJSON('bth_touched', TOUCHED);
        updateControls();
      });
      slider.addEventListener('change', function(){ pill.classList.remove('is-live'); });
    });
  }

  function updateIntro(){
    helloLine.textContent = current === QUESTIONS.length - 1 ? ('One last check-in, ' + name + '.') : ('Let’s check in, ' + name + '.');
    supportLine.textContent = TOPICS[QUESTIONS[current].topic].support;
  }

  function updateControls(){
    var question = QUESTIONS[current];
    var topic = TOPICS[question.topic];
    var value = RESPONSES[question.id] !== undefined ? Number(RESPONSES[question.id]) : 50;
    var answered = !!TOUCHED[question.id];
    topicTag.textContent = topic.icon + ' ' + topic.label;
    qNum.textContent = (current + 1) + ' / ' + QUESTIONS.length;
    progFill.style.width = (((current + 1) / QUESTIONS.length) * 100) + '%';
    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === QUESTIONS.length - 1 ? 'See Results →' : 'Next →';
    responseBox.innerHTML = answered ? reflectionFor(question, value) : 'Pause here for a second and answer with whatever feels most accurate today.';
    responseBox.classList.add('visible');
    updateIntro();
  }

  function transitionTo(nextIndex, direction){
    if(locked || nextIndex === current || nextIndex < 0 || nextIndex >= QUESTIONS.length){ return; }
    locked = true;

    var outgoing = cards[current];
    var incoming = cards[nextIndex];
    var leaveClass = direction === 'forward' ? 'leaving-forward' : 'leaving-backward';
    var enterClass = direction === 'forward' ? 'entering-forward' : 'entering-backward';

    outgoing.classList.remove('active', 'entering-forward', 'entering-backward', 'leaving-forward', 'leaving-backward');
    incoming.classList.remove('active', 'entering-forward', 'entering-backward', 'leaving-forward', 'leaving-backward');

    outgoing.classList.add(leaveClass);
    incoming.classList.add(enterClass);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        incoming.classList.add('active');
        incoming.classList.remove(enterClass);
        current = nextIndex;
        updateControls();
      });
    });

    setTimeout(function(){
      outgoing.classList.remove(leaveClass);
      locked = false;
    }, 720);
  }

  function finish(){
    saveJSON('bth_resp', RESPONSES);
    saveJSON('bth_touched', TOUCHED);
    document.body.classList.add('page-exit');
    setTimeout(function(){ window.location.href = 'results.html'; }, 540);
  }

  nextBtn.addEventListener('click', function(){
    if(current === QUESTIONS.length - 1){
      finish();
      return;
    }
    transitionTo(current + 1, 'forward');
  });

  prevBtn.addEventListener('click', function(){
    transitionTo(current - 1, 'backward');
  });

  document.addEventListener('keydown', function(e){
    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    if(tag === 'input' || tag === 'textarea' || tag === 'button'){ return; }
    if(e.key === 'ArrowDown' || e.key === 'PageDown'){
      if(current < QUESTIONS.length - 1){ transitionTo(current + 1, 'forward'); }
    }
    if(e.key === 'ArrowUp' || e.key === 'PageUp'){
      if(current > 0){ transitionTo(current - 1, 'backward'); }
    }
  });

  stage.addEventListener('touchstart', function(e){
    touchY = e.touches[0].clientY;
  }, {passive:true});

  stage.addEventListener('touchend', function(e){
    var delta = touchY - e.changedTouches[0].clientY;
    if(Math.abs(delta) < 50){ return; }
    if(delta > 0 && current < QUESTIONS.length - 1){ transitionTo(current + 1, 'forward'); }
    if(delta < 0 && current > 0){ transitionTo(current - 1, 'backward'); }
  }, {passive:true});

  buildCards();
  updateControls();
})();
</script>
</body>
</html>
