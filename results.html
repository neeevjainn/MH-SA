<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Results — Breathe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@300;400&display=swap');
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #0f0f0f;
    color: #eee;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }
 
  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 24px 60px;
  }
 
  h1 {
    font-family: 'Caveat', cursive;
    font-size: 48px;
    font-weight: 400;
    margin-bottom: 10px;
  }
 
  .subtitle {
    font-size: 14px;
    color: #888;
    line-height: 1.7;
    margin-bottom: 32px;
  }
 
  /* summary sentence */
  .summary {
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 15px;
    color: #bbb;
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .summary strong { color: #eee; font-weight: 400; }
 
  /* topic cards */
  .cards { display: grid; gap: 12px; margin-bottom: 28px; }
 
  .card {
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 18px 20px;
  }
 
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
 
  .card-topic {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
 
  .card-state {
    font-family: 'Caveat', cursive;
    font-size: 26px;
  }
 
  .card-score {
    font-size: 11px;
    color: #555;
  }
 
  /* simple score bar */
  .bar-bg {
    height: 3px;
    background: #222;
    border-radius: 2px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0;
    border-radius: 2px;
    transition: width 0.8s ease;
  }
 
  .card-body {
    font-size: 14px;
    color: #999;
    line-height: 1.75;
    margin-bottom: 12px;
  }
 
  .tips-label {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
 
  .tip {
    font-size: 13px;
    color: #888;
    line-height: 1.7;
    padding-left: 12px;
    position: relative;
    margin-bottom: 4px;
  }
  .tip::before { content: '–'; position: absolute; left: 0; color: #555; }
 
  .card-note {
    margin-top: 12px;
    padding: 10px 14px;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    font-size: 12px;
    color: #777;
    line-height: 1.6;
  }
 
  /* warning box */
  .support {
    border: 1px solid #5a3535;
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 14px;
    color: #bbb;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .support strong { color: #eee; font-weight: 400; }
 
  /* closing quote */
  .closing {
    font-family: 'Caveat', cursive;
    font-size: 24px;
    color: #666;
    text-align: center;
    padding: 20px 0;
  }
 
  /* buttons row */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
 
  button {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 20px;
    color: #aaa;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #222; color: #eee; }
</style>
</head>
<body>
<div class="page">
 
  <h1 id="title">Your check-in.</h1>
  <p class="subtitle">These reflect what you shared today. Read them gently, not critically.</p>
 
  <div class="summary" id="summary"></div>
 
  <div class="cards" id="cards"></div>
 
  <div class="support" id="support" style="display:none"></div>
 
  <p class="closing" id="closing"></p>
 
  <div class="actions">
    <button id="diaryBtn">Open Diary</button>
    <button id="downloadBtn">Download</button>
    <button id="retakeBtn">Retake</button>
  </div>
 
</div>
<script>
  var QUESTIONS = [
    { id:'q1',  topic:'mood',    inv:false }, { id:'q2',  topic:'mood',    inv:true  },
    { id:'q3',  topic:'mood',    inv:false }, { id:'q4',  topic:'anxiety', inv:false },
    { id:'q5',  topic:'anxiety', inv:true  }, { id:'q6',  topic:'anxiety', inv:false },
    { id:'q7',  topic:'sleep',   inv:false }, { id:'q8',  topic:'sleep',   inv:true  },
    { id:'q9',  topic:'social',  inv:false }, { id:'q10', topic:'social',  inv:true  },
    { id:'q11', topic:'self',    inv:false }, { id:'q12', topic:'self',    inv:true  },
  ];
 
  var TOPICS = ['mood', 'anxiety', 'sleep', 'social', 'self'];
 
  var META = {
    mood:    'Emotional Wellbeing',
    anxiety: 'Anxiety & Stress',
    sleep:   'Sleep & Energy',
    social:  'Connection',
    self:    'Self-Worth',
  };
 
  var CONTENT = {
    mood: {
      high: { label:'Feeling steadier',  color:'#6a9e74', body:'There seems to be some hope and lightness available to you right now. Moments of steadiness are real and worth protecting.', tips:['Notice what has been lifting your mood lately.','Keep one small thing that brings you comfort.','Let yourself enjoy the good moments.'], note:null },
      mid:  { label:'Mixed emotions',    color:'#a08d57', body:'Some parts may feel okay while others feel heavier — that\'s a very human place to be.', tips:['Track what shifts your mood up or down.','Try a change of scenery today.','Reach out to someone safe, even briefly.'], note:'If low moments are becoming more frequent, speaking with a therapist or GP could help.' },
      low:  { label:'Carrying weight',   color:'#a06060', body:'Things may be feeling emotionally heavy. Low mood can drain energy quietly, and that deserves care.', tips:['Keep today small and gentle.','Try one familiar comfort without pressure.','Use the diary to name what feels hardest.'], note:'If these feelings feel persistent or unsafe, please reach out to a mental health professional.' },
    },
    anxiety: {
      high: { label:'More settled',    color:'#6a9e74', body:'Your responses suggest some room to breathe. There may be a steadier baseline underneath your days.', tips:['Notice what supports this calmer state.','Protect your recovery time.','Keep grounding habits nearby for harder days.'], note:null },
      mid:  { label:'Some tension',    color:'#a08d57', body:'There seems to be some ongoing stress in the background. Even manageable anxiety is tiring when it stays on.', tips:['Try a longer exhale than inhale for a few breaths.','Write one specific worry down instead of carrying it.','Reduce one unnecessary demand today.'], note:'If anxiety is affecting sleep or daily life regularly, a therapist can help.' },
      low:  { label:'High distress',   color:'#a06060', body:'Your answers suggest your nervous system may be under significant strain. That\'s hard to carry alone.', tips:['Ground yourself: name 5 things you see, 4 you feel, 3 you hear.','Lower stimulation for a while.','Ask someone you trust to stay close today.'], note:'Anxiety at this level is treatable. If you feel overwhelmed or unsafe, please seek support.' },
    },
    sleep: {
      high: { label:'Resting better', color:'#6a9e74', body:'Sleep seems to be offering some real recovery lately. That supports everything else, so it\'s worth protecting.', tips:['Keep your wind-down routine consistent.','Notice what\'s been helping on better nights.','Stick to a regular wake-up time.'], note:null },
      mid:  { label:'Uneven rest',    color:'#a08d57', body:'Your rest looks inconsistent. Patchy sleep quietly shapes mood, focus, and resilience.', tips:['Keep your wake-up time consistent even on weekends.','Limit screens close to bedtime.','Check if caffeine or stress is playing a role.'], note:'If sleep issues continue for weeks, it\'s worth talking to a GP.' },
      low:  { label:'Sleep strain',   color:'#a06060', body:'Sleep appears to be a real pressure point right now. Poor rest intensifies everything else.', tips:['Treat your sleep as seriously as you\'d treat any health issue.','Reduce stimulation in the hour before bed.','Look into CBT-I sleep support if insomnia is a pattern.'], note:'Ongoing disrupted sleep is very treatable with professional support.' },
    },
    social: {
      high: { label:'Feeling connected',  color:'#6a9e74', body:'There seems to be meaningful connection in your life. Feeling seen is deeply protective for mental health.', tips:['Lean into people who make you feel safe.','Tell someone you appreciate them.','Make space for one good conversation this week.'], note:null },
      mid:  { label:'Partly connected',   color:'#a08d57', body:'Connection may be present but not always in a way that fully nourishes you. That difference matters.', tips:['Reach out to one person you trust.','Choose depth over volume in your interactions.','Try being a little more honest with someone safe.'], note:'If loneliness is becoming a pattern, talking with a therapist can help.' },
      low:  { label:'Feeling isolated',   color:'#a06060', body:'Your responses suggest loneliness may be weighing on you. That pain is real even when invisible to others.', tips:['Start with one small point of contact.','Consider a recurring class, group, or shared activity.','Use the diary to write how alone this actually feels.'], note:'Persistent loneliness has a big impact on wellbeing. Support can make a real difference.' },
    },
    self: {
      high: { label:'Self-compassion present', color:'#6a9e74', body:'There\'s some gentleness in how you\'re relating to yourself. That\'s one of the foundations of resilience.', tips:['Keep noticing when you\'re being fair to yourself.','Speak to yourself like you\'d speak to someone you love.','Let rest count as real progress.'], note:null },
      mid:  { label:'Mixed self-view',         color:'#a08d57', body:'You may be moving between self-kindness and self-criticism. That tension is common but worth paying attention to.', tips:['Catch one harsh thought and rewrite it more fairly.','Notice when tiredness makes your inner voice sharper.','Use the diary to be more honest and kind to yourself.'], note:'If self-criticism feels persistent or painful, therapy can be really effective here.' },
      low:  { label:'Harsh inner voice',       color:'#a06060', body:'You may be carrying a lot of self-criticism right now. That kind of inner pressure is exhausting.', tips:['Keep today\'s bar small and compassionate.','Write down three things you did well enough.','Challenge the idea that being hard on yourself helps.'], note:'Low self-worth is very treatable — you don\'t have to stay stuck here.' },
    },
  };
 
  var name = localStorage.getItem('bth_name') || 'friend';
  var responses = {};
  try { responses = JSON.parse(localStorage.getItem('bth_resp')) || {}; } catch(e) {}
 
  // calculate scores
  function calcScores() {
    var totals = {}, counts = {};
    QUESTIONS.forEach(function(q) {
      var raw = responses[q.id] !== undefined ? Number(responses[q.id]) : 50;
      var val = q.inv ? 100 - raw : raw;
      totals[q.topic] = (totals[q.topic] || 0) + val;
      counts[q.topic] = (counts[q.topic] || 0) + 1;
    });
    var out = {};
    TOPICS.forEach(function(t) { out[t] = Math.round(totals[t] / counts[t]); });
    return out;
  }
 
  function band(s) { return s >= 70 ? 'high' : s >= 35 ? 'mid' : 'low'; }
 
  var scores  = calcScores();
  var sorted  = TOPICS.slice().sort(function(a,b){ return scores[b]-scores[a]; });
  var best    = sorted[0];
  var hardest = sorted[sorted.length - 1];
  var avg     = Math.round(TOPICS.reduce(function(s,t){ return s+scores[t]; }, 0) / TOPICS.length);
  var anyLow  = TOPICS.some(function(t){ return scores[t] < 25; });
 
  document.getElementById('title').textContent = 'Your check-in, ' + name + '.';
 
  document.getElementById('summary').innerHTML =
    '<strong>' + META[best] + '</strong> looks like your steadiest area right now. ' +
    '<strong>' + META[hardest] + '</strong> may need the most care today.';
 
  var cardsEl = document.getElementById('cards');
 
  TOPICS.forEach(function(topic) {
    var s = scores[topic];
    var c = CONTENT[topic][band(s)];
 
    var tipsHTML = c.tips.map(function(t){ return '<div class="tip">'+t+'</div>'; }).join('');
    var noteHTML = c.note ? '<div class="card-note">'+c.note+'</div>' : '';
 
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-header">' +
        '<div>' +
          '<div class="card-topic">'+META[topic]+'</div>' +
          '<div class="card-state" style="color:'+c.color+'">'+c.label+'</div>' +
        '</div>' +
        '<div class="card-score">'+s+' / 100</div>' +
      '</div>' +
      '<div class="bar-bg"><div class="bar" data-w="'+s+'" style="background:'+c.color+'"></div></div>' +
      '<p class="card-body">'+c.body+'</p>' +
      '<p class="tips-label">What might help</p>' +
      tipsHTML +
      noteHTML;
 
    cardsEl.appendChild(card);
  });
 
  // animate bars
  setTimeout(function() {
    document.querySelectorAll('.bar').forEach(function(b) {
      b.style.width = b.getAttribute('data-w') + '%';
    });
  }, 150);
 
  if (anyLow) {
    var sup = document.getElementById('support');
    sup.style.display = '';
    sup.innerHTML = '<strong>A gentle note:</strong> One or more areas look especially strained. If things feel overwhelming or unsafe, please reach out to a mental health professional or crisis line.';
  }
 
  var closingEl = document.getElementById('closing');
  if (avg >= 70) closingEl.textContent = 'There\'s more steadiness here than you\'re probably giving yourself credit for, ' + name + '.';
  else if (avg >= 35) closingEl.textContent = 'You don\'t have to be fully okay to be making it through, ' + name + '.';
  else closingEl.textContent = 'Thank you for being honest today, ' + name + '. Please be extra gentle with yourself.';
 
  document.getElementById('diaryBtn').addEventListener('click', function(){ window.location.href = 'diary.html'; });
  document.getElementById('retakeBtn').addEventListener('click', function(){ window.location.href = 'questions.html'; });
 
  document.getElementById('downloadBtn').addEventListener('click', function() {
    var lines = ['BREATHE — Results', 'Date: ' + new Date().toLocaleDateString(), 'Name: ' + name, ''];
    TOPICS.forEach(function(t) {
      var s = scores[t]; var c = CONTENT[t][band(s)];
      lines.push(META[t] + ' — ' + c.label + ' (' + s + '/100)');
      lines.push(c.body);
      c.tips.forEach(function(tip){ lines.push('- ' + tip); });
      if (c.note) lines.push('Note: ' + c.note);
      lines.push('');
    });
    lines.push(closingEl.textContent, '', 'This is a reflection tool, not a medical diagnosis.');
    var blob = new Blob([lines.join('\n')], { type:'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'breathe-' + new Date().toISOString().slice(0,10) + '.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
</script>
</body>
</html>
