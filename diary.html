<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Space — Breathe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@300;400&display=swap');
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
 
  body {
    background: #0f0f0f;
    color: #eee;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
  }
 
  /* header */
  .header {
    padding: 48px 32px 16px;
    flex-shrink: 0;
  }
  .header h1 {
    font-family: 'Caveat', cursive;
    font-size: 42px;
    font-weight: 400;
    margin-bottom: 4px;
  }
  .header p {
    font-size: 12px;
    color: #555;
  }
 
  /* writing prompt */
  .prompt {
    margin: 0 32px 12px;
    padding: 12px 16px;
    border: 1px solid #222;
    border-radius: 8px;
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    font-style: italic;
    flex-shrink: 0;
  }
 
  /* textarea fills the space */
  .area {
    flex: 1;
    padding: 0 32px;
    min-height: 0;
  }
 
  textarea {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    line-height: 1.8;
    color: #ddd;
    caret-color: #888;
    scrollbar-width: thin;
    scrollbar-color: #222 transparent;
  }
  textarea::placeholder { color: #333; }
 
  /* divider */
  hr {
    border: none;
    border-top: 1px solid #1e1e1e;
    margin: 12px 32px 0;
    flex-shrink: 0;
  }
 
  /* footer */
  .footer {
    padding: 12px 32px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
 
  .meta {
    font-size: 11px;
    color: #444;
  }
 
  .right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
 
  .wordcount {
    font-size: 11px;
    color: #555;
  }
 
  button {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 9px 18px;
    color: #888;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #222; color: #eee; }
 
  /* confirm modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    display: none;
  }
  .modal-bg.show { display: flex; }
 
  .modal {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px 28px;
    width: min(300px, 100%);
    text-align: center;
    display: grid;
    gap: 10px;
  }
  .modal h2 {
    font-family: 'Caveat', cursive;
    font-size: 30px;
    font-weight: 400;
  }
  .modal p { font-size: 14px; color: #888; line-height: 1.6; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
</style>
</head>
<body>
 
  <div class="header">
    <h1 id="title">Your space.</h1>
    <p>Write freely. Nothing here is saved or sent anywhere — it clears when you close the page.</p>
  </div>
 
  <div class="prompt" id="prompt"></div>
 
  <div class="area">
    <textarea id="ta" placeholder="Start wherever your mind is right now..."></textarea>
  </div>
 
  <hr />
 
  <div class="footer">
    <span class="meta">Private · local only · clears on close</span>
    <div class="right">
      <span class="wordcount" id="wc">0 words</span>
      <button id="clearBtn">Clear</button>
      <button id="backBtn">← Results</button>
    </div>
  </div>
 
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2>Clear everything?</h2>
      <p>This will remove everything you've written here.</p>
      <div class="modal-btns">
        <button id="keepBtn">Keep it</button>
        <button id="yesBtn">Yes, clear</button>
      </div>
    </div>
  </div>
 
<script>
  var name = localStorage.getItem('bth_name') || 'friend';
  document.getElementById('title').textContent = 'Your space, ' + name + '.';
 
  var prompts = [
    'What feels heaviest right now, and what do you wish someone understood about it?',
    'What would a gentler day look like for you today?',
    'If your mind has been loud lately, what has it been saying most?',
    'What are you carrying alone that might feel lighter written down?',
  ];
  document.getElementById('prompt').textContent = prompts[Math.floor(Math.random() * prompts.length)];
 
  var ta  = document.getElementById('ta');
  var wc  = document.getElementById('wc');
  var modal = document.getElementById('modal');
  var allowLeave = false;
 
  ta.addEventListener('input', function() {
    var words = ta.value.trim().split(/\s+/).filter(Boolean).length;
    wc.textContent = words === 1 ? '1 word' : words + ' words';
  });
 
  setTimeout(function(){ ta.focus(); }, 100);
 
  document.getElementById('backBtn').addEventListener('click', function() {
    allowLeave = true;
    window.location.href = 'results.html';
  });
 
  document.getElementById('clearBtn').addEventListener('click', function() {
    modal.classList.add('show');
  });
  document.getElementById('keepBtn').addEventListener('click', function() {
    modal.classList.remove('show');
    ta.focus();
  });
  document.getElementById('yesBtn').addEventListener('click', function() {
    ta.value = '';
    wc.textContent = '0 words';
    modal.classList.remove('show');
    ta.focus();
  });
  modal.addEventListener('click', function(e) {
    if (e.target === modal) { modal.classList.remove('show'); ta.focus(); }
  });
 
  window.addEventListener('beforeunload', function(e) {
    if (!allowLeave && ta.value.trim()) { e.preventDefault(); e.returnValue = ''; }
  });
</script>
</body>
</html>
