<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Space — Breathe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Lora:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400&display=swap');

/* ── Variables ── */
:root {
  --bg: #0e0e0e;
  --text: #f0ede8;
  --text2: #b0aca6;
  --muted: #585858;
  --surface: #1c1c1c;
  --border: #2c2c2c;
  --border2: #3a3a3a;
  --font-display: 'Caveat', cursive;
  --font-body: 'Lora', serif;
  --font-ui: 'DM Sans', sans-serif;
}
[data-theme="light"] {
  --bg: #f4f1ec;
  --text: #1c1a17;
  --text2: #56524d;
  --muted: #9a9590;
  --surface: #e6e1da;
  --border: #ccc7bf;
  --border2: #b5b0a8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  display: flex;
  flex-direction: column;
  transition: background 0.4s, color 0.4s;
}

/* ── Theme toggle ── */
.theme-btn {
  position: fixed;
  top: 20px;
  right: 24px;
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 300;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  z-index: 10;
}
.theme-btn:hover { color: var(--text2); }

/* ── Main layout (fills the screen) ── */
.shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 72px 36px 20px;
  gap: 14px;
  min-height: 0;
}

/* ── Header ── */
.title {
  font-family: var(--font-display);
  font-size: clamp(30px, 5vw, 50px);
  font-weight: 400;
  color: var(--text);
  margin-bottom: 4px;
}
.subtitle {
  font-size: 11px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* ── Writing prompt ── */
.prompt {
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: rgba(255,255,255,0.02);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.7;
  color: var(--text2);
  font-style: italic;
}

/* ── Textarea fills remaining space ── */
.area {
  flex: 1;
  min-height: 0; /* needed for flex children to scroll properly */
}

textarea {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.9;
  color: var(--text);
  caret-color: var(--text2);
  /* custom scrollbar */
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
textarea::placeholder { color: var(--muted); font-style: italic; }

/* ── Divider ── */
.divider {
  height: 1px;
  background: var(--border);
  flex-shrink: 0;
}

/* ── Footer ── */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding-bottom: 4px;
  flex-shrink: 0;
}
.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.06em;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
  opacity: 0.5;
}
.word-count {
  font-size: 11px;
  color: var(--muted);
}
.actions { display: flex; gap: 9px; }

.btn {
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 300;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn:hover { background: var(--border2); color: var(--text); }

/* ── Clear confirmation modal ── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-bg.visible {
  opacity: 1;
  pointer-events: all;
}
.modal {
  width: min(320px, 100%);
  padding: 26px 28px;
  border: 1px solid var(--border2);
  border-radius: 22px;
  background: var(--surface);
  text-align: center;
  display: grid;
  gap: 10px;
}
.modal h2 {
  font-family: var(--font-display);
  font-size: 28px;
  color: var(--text);
}
.modal p {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text2);
  line-height: 1.6;
}
.modal-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 4px;
}

/* ── Fade out on navigate ── */
body.fade-out { animation: fadeOut 0.5s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>

  <button class="theme-btn" id="themeBtn">Light / Dark</button>

  <div class="shell">
    <header>
      <h1 class="title" id="pageTitle">Your space.</h1>
      <p class="subtitle">Write freely. Nothing here is uploaded or saved anywhere.</p>
    </header>

    <!-- A random writing prompt to help get started -->
    <div class="prompt" id="prompt"></div>

    <div class="area">
      <textarea id="ta" placeholder="Start where your mind keeps returning. You don't need to make it polished."></textarea>
    </div>

    <div class="divider"></div>

    <footer class="footer">
      <div class="meta">
        <span class="dot"></span>
        <span>Private · Local only · Clears on close</span>
      </div>
      <span class="word-count" id="wordCount">0 words</span>
      <div class="actions">
        <button class="btn" id="clearBtn">Clear</button>
        <button class="btn" id="backBtn">← Results</button>
      </div>
    </footer>
  </div>

  <!-- Confirmation modal before clearing -->
  <div class="modal-bg" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Clear everything?</h2>
      <p>This will remove everything you've written here.</p>
      <div class="modal-btns">
        <button class="btn" id="keepBtn">Keep it</button>
        <button class="btn" id="yesBtn">Yes, clear</button>
      </div>
    </div>
  </div>

<script>
(function () {

  // ── Theme ──
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  root.setAttribute('data-theme', localStorage.getItem('bth_theme') || 'dark');
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('bth_theme', next);
  });


  // ── Personalise title ──
  var name = localStorage.getItem('bth_name') || 'friend';
  document.getElementById('pageTitle').textContent = 'Your space, ' + name + '.';


  // ── Random writing prompt ──
  var prompts = [
    'What feels heaviest in your chest right now, and what do you wish someone understood about it?',
    'What would a gentler day look like for you today?',
    'If your mind has been loud lately, what has it been saying most often?',
    'What are you carrying alone that might feel lighter once it is written down?'
  ];
  document.getElementById('prompt').textContent = prompts[Math.floor(Math.random() * prompts.length)];


  // ── Word count ──
  var ta        = document.getElementById('ta');
  var wordCount = document.getElementById('wordCount');

  function updateWordCount() {
    var words = ta.value.trim().split(/\s+/).filter(Boolean).length;
    wordCount.textContent = words === 1 ? '1 word' : words + ' words';
  }

  ta.addEventListener('input', updateWordCount);
  updateWordCount();
  setTimeout(function () { ta.focus(); }, 100);


  // ── Navigation ──
  var allowLeave = false;

  function nav(url) {
    allowLeave = true;
    document.body.classList.add('fade-out');
    setTimeout(function () { window.location.href = url; }, 500);
  }

  document.getElementById('backBtn').addEventListener('click', function () { nav('results.html'); });


  // ── Clear modal ──
  var modal = document.getElementById('modal');

  document.getElementById('clearBtn').addEventListener('click', function () {
    modal.classList.add('visible');
  });
  document.getElementById('keepBtn').addEventListener('click', function () {
    modal.classList.remove('visible');
    ta.focus();
  });
  document.getElementById('yesBtn').addEventListener('click', function () {
    ta.value = '';
    updateWordCount();
    modal.classList.remove('visible');
    ta.focus();
  });

  // Click outside modal = close it
  modal.addEventListener('click', function (e) {
    if (e.target === modal) {
      modal.classList.remove('visible');
      ta.focus();
    }
  });


  // ── Warn before leaving if there's unsaved text ──
  window.addEventListener('beforeunload', function (e) {
    if (!allowLeave && ta.value.trim()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

})();
</script>
</body>
</html>
