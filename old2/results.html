<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Results — Breathe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500&display=swap');
:root{--bg:#10100f;--bg2:#171715;--surface:rgba(28,28,26,.82);--surface2:rgba(38,38,35,.96);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#f3efe9;--text2:#cbc4ba;--muted:#8c857b;--shadow:0 26px 90px rgba(0,0,0,.32);--font-display:'Caveat',cursive;--font-body:'Lora',serif;--font-ui:'DM Sans',sans-serif;--pill:999px;--dur:.55s;--ease:cubic-bezier(.22,1,.36,1);}
[data-theme="light"]{--bg:#f4f0e8;--bg2:#ebe4d9;--surface:rgba(255,255,255,.72);--surface2:rgba(248,243,235,.94);--border:rgba(46,37,28,.09);--border2:rgba(46,37,28,.16);--text:#1f1a16;--text2:#5e554d;--muted:#8e8479;--shadow:0 26px 90px rgba(87,68,41,.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:
radial-gradient(circle at top, rgba(197,174,153,.12), transparent 32%),
radial-gradient(circle at bottom right, rgba(116,154,136,.12), transparent 28%),
linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);font-family:var(--font-ui);transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 15% 20%, rgba(255,255,255,.05), transparent 24%),
radial-gradient(circle at 82% 78%, rgba(255,255,255,.04), transparent 20%);}
.theme-ctrl{position:fixed;top:22px;right:22px;z-index:20;display:inline-flex;align-items:center;gap:10px;background:transparent;border:none;color:inherit;cursor:pointer;font:inherit;}
.theme-lbl{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}
.tog{position:relative;width:46px;height:24px;background:var(--surface2);border-radius:var(--pill);border:1px solid var(--border2);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text2);transition:transform .45s var(--ease),background var(--dur) var(--ease);}
[data-theme="light"] .tog::after{transform:translateX(22px);}
.wrap{position:relative;max-width:940px;margin:0 auto;padding:84px 22px 56px;}
.hero{display:grid;gap:18px;margin-bottom:20px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:9px 12px;border:1px solid var(--border);border-radius:var(--pill);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.03);}
.title{font-family:var(--font-display);font-size:clamp(34px,6vw,62px);line-height:.98;max-width:760px;}
.sub{max-width:720px;font-family:var(--font-body);font-size:18px;line-height:1.8;color:var(--text2);}
.summary-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:18px;margin:10px 0 26px;}
.panel{padding:24px;border:1px solid var(--border);border-radius:30px;background:var(--surface);backdrop-filter:blur(20px);box-shadow:var(--shadow);}
.panel-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.summary-main{font-family:var(--font-body);font-size:18px;line-height:1.9;color:var(--text2);}
.summary-main strong{color:var(--text);font-weight:500;}
.insights{display:grid;gap:12px;}
.insight{padding:16px;border:1px solid var(--border);border-radius:22px;background:rgba(255,255,255,.025);}
.insight h3{font-size:13px;font-weight:500;margin-bottom:8px;}
.insight p{font-family:var(--font-body);font-size:15px;line-height:1.7;color:var(--text2);}
.cards{display:grid;gap:14px;}
.card{padding:22px;border:1px solid var(--border);border-radius:28px;background:var(--surface);backdrop-filter:blur(18px);opacity:0;transform:translateY(20px);animation:rise .62s var(--ease) forwards;}
@keyframes rise{to{opacity:1;transform:none}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;}
.card-title-wrap{display:grid;gap:6px;}
.card-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.card-state{font-family:var(--font-display);font-size:28px;line-height:1;}
.score{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:6px;}
.bar-wrap{height:5px;background:rgba(255,255,255,.06);border-radius:var(--pill);overflow:hidden;margin-bottom:16px;}
.bar{height:100%;width:0;border-radius:inherit;transition:width 1.1s var(--ease);}
.body{font-family:var(--font-body);font-size:16px;line-height:1.8;color:var(--text2);margin-bottom:16px;}
.mini-head{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.tips{display:grid;gap:8px;}
.tip{padding-left:14px;position:relative;font-size:14px;line-height:1.7;color:var(--text2);}
.tip::before{content:'•';position:absolute;left:0;color:var(--muted);}
.note{margin-top:14px;padding:14px 16px;border:1px solid var(--border2);border-radius:18px;background:var(--surface2);font-size:13px;line-height:1.7;color:var(--text2);}
.support{margin-top:18px;padding:18px 20px;border:1px solid rgba(197,138,135,.32);border-radius:24px;background:rgba(197,138,135,.08);font-family:var(--font-body);font-size:16px;line-height:1.8;color:var(--text2);}
.support strong{color:var(--text);}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--pill);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font-ui);font-size:13px;font-weight:400;letter-spacing:.04em;cursor:pointer;text-decoration:none;transition:transform .22s var(--ease),background .3s var(--ease);}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(1px) scale(.985);}
.closing{padding:26px 0 4px;font-family:var(--font-display);font-size:28px;line-height:1.3;color:var(--text2);text-align:center;}
.page-enter{animation:pageIn .72s var(--ease) both;}
.page-exit{animation:pageOut .58s cubic-bezier(.4,0,.2,1) both;}
@keyframes pageIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pageOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-26px)}}
@media (max-width:820px){
  .wrap{padding:84px 14px 44px;}
  .summary-grid{grid-template-columns:1fr;}
  .card-head{flex-direction:column;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body class="page-enter">
<button class="theme-ctrl" id="themeCtrl" type="button" aria-label="Toggle theme">
  <span class="theme-lbl" id="themeLbl">Dark</span>
  <span class="tog" aria-hidden="true"></span>
</button>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">Your reflection</span>
    <h1 class="title" id="title">Here’s where you are today.</h1>
    <p class="sub" id="subtitle">These results are a gentle snapshot, not a diagnosis. Read them with curiosity, not judgment.</p>
  </section>

  <section class="summary-grid">
    <div class="panel">
      <p class="panel-title">Overall pattern</p>
      <p class="summary-main" id="summaryMain"></p>
    </div>
    <div class="panel">
      <p class="panel-title">What stood out</p>
      <div class="insights" id="insights"></div>
    </div>
  </section>

  <section class="cards" id="cards"></section>

  <div class="support" id="supportBox" hidden></div>

  <div class="actions">
    <button class="btn" id="diaryBtn" type="button">Open Diary</button>
    <button class="btn" id="downloadBtn" type="button">Download Results</button>
    <button class="btn" id="retakeBtn" type="button">Retake</button>
  </div>

  <p class="closing" id="closing"></p>
</main>

<script>
(function(){
  var root = document.documentElement;
  var themeCtrl = document.getElementById('themeCtrl');
  var themeLbl = document.getElementById('themeLbl');
  var cardsEl = document.getElementById('cards');
  var insightsEl = document.getElementById('insights');
  var summaryMain = document.getElementById('summaryMain');
  var closing = document.getElementById('closing');
  var supportBox = document.getElementById('supportBox');
  var name = localStorage.getItem('bth_name') || 'friend';
  var responses = loadJSON('bth_resp', {});

  var QUESTIONS = [
    {id:'q1', topic:'mood', inv:false}, {id:'q2', topic:'mood', inv:true}, {id:'q3', topic:'mood', inv:false},
    {id:'q4', topic:'anxiety', inv:false}, {id:'q5', topic:'anxiety', inv:true}, {id:'q6', topic:'anxiety', inv:false},
    {id:'q7', topic:'sleep', inv:false}, {id:'q8', topic:'sleep', inv:true},
    {id:'q9', topic:'social', inv:false}, {id:'q10', topic:'social', inv:true},
    {id:'q11', topic:'self', inv:false}, {id:'q12', topic:'self', inv:true}
  ];

  var ORDER = ['mood','anxiety','sleep','social','self'];
  var META = {
    mood:{label:'Emotional Wellbeing', icon:'☼'},
    anxiety:{label:'Anxiety & Stress', icon:'◌'},
    sleep:{label:'Sleep & Energy', icon:'☾'},
    social:{label:'Connection', icon:'∞'},
    self:{label:'Self-Worth', icon:'✦'}
  };

  var CONTENT = {
    mood:{
      high:{label:'Feeling Steadier', color:'#74a87f', body:'There seems to be some hope and emotional lightness available to you right now. Even if life is not perfect, moments of steadiness are present and worth protecting.', tips:['Notice what has been helping your mood feel lighter.','Keep one small ritual that brings a sense of comfort or joy.','Let yourself enjoy the good moments without minimizing them.'], note:null},
      mid:{label:'Mixed Emotions', color:'#b39b63', body:'Your emotional world looks mixed at the moment. Some parts may feel okay while others feel heavier, which is a very human place to be.', tips:['Track what tends to shift your mood up or down.','Try gentle movement or a change of scenery today.','Reach out to someone safe, even briefly.'], note:'If the low moments are becoming more frequent or intense, speaking with a therapist, counsellor, or GP could help.'},
      low:{label:'Carrying Weight', color:'#ba7670', body:'Things may be feeling emotionally heavy right now. Low mood or numbness can quietly drain energy, and that deserves care rather than dismissal.', tips:['Keep today small and gentle where possible.','Try one familiar comfort without pressure to feel better instantly.','Use the diary to name what feels hardest right now.'], note:'If these feelings feel persistent, overwhelming, or unsafe, please reach out to a mental health professional or local crisis support.'}
    },
    anxiety:{
      high:{label:'More Settled', color:'#74a87f', body:'Your responses suggest some room to breathe. There may be a steadier baseline underneath your days, and that is something real.', tips:['Notice what supports this calmer state.','Protect recovery time, not just productivity time.','Keep grounding habits nearby for harder days.'], note:null},
      mid:{label:'Some Tension', color:'#b39b63', body:'There seems to be some ongoing stress or mental pressure in the background. Even manageable anxiety can be tiring when it stays switched on.', tips:['Try a longer exhale than inhale for a few breaths.','Name one specific worry on paper instead of carrying all of it at once.','Reduce one unnecessary demand today if you can.'], note:'If anxiety is regularly affecting sleep, focus, or daily life, a therapist can offer practical tools.'},
      low:{label:'High Distress', color:'#ba7670', body:'Your answers point to a nervous system that may be under significant strain. Racing thoughts, difficulty settling, and persistent worry are hard to carry alone.', tips:['Ground yourself in the present: five things you see, four you feel, three you hear.','Lower stimulation for a while if possible.','Ask someone you trust to stay connected with you today.'], note:'Anxiety at this intensity is treatable. If you feel overwhelmed or unsafe, please seek immediate professional or crisis support.'}
    },
    sleep:{
      high:{label:'Resting Better', color:'#74a87f', body:'Sleep seems to be offering some recovery lately. That kind of restoration supports everything else, so it is worth protecting.', tips:['Keep your wind-down routine consistent.','Notice what was different on better sleep nights.','Hold on to a stable wake-up time when you can.'], note:null},
      mid:{label:'Uneven Rest', color:'#b39b63', body:'Your rest looks inconsistent. When sleep is patchy, it can quietly shape mood, focus, and resilience throughout the day.', tips:['Keep your wake-up time as consistent as possible.','Limit bright screens close to bedtime.','Check whether caffeine, stress, or late stimulation may be playing a role.'], note:'If sleep difficulties keep going for weeks, discussing them with a GP or clinician could be useful.'},
      low:{label:'Sleep Strain', color:'#ba7670', body:'Sleep appears to be a real pressure point right now. Poor rest can intensify emotional strain and make everything feel harder to manage.', tips:['Treat sleep struggles as important, not minor.','Try to reduce stimulation in the hour before bed.','Explore CBT-I style sleep support if insomnia is a pattern for you.'], note:'If disrupted sleep is ongoing or severe, professional support is worth seeking. Sleep problems are very treatable.'}
    },
    social:{
      high:{label:'Feeling Connected', color:'#74a87f', body:'There seems to be meaningful connection in your life. Feeling seen and accompanied is deeply protective for mental health.', tips:['Lean into the people who help you feel safe and known.','Tell someone you appreciate them.','Make room for one nourishing conversation this week.'], note:null},
      mid:{label:'Partly Connected', color:'#b39b63', body:'Connection may be present, but not always in the way that fully nourishes you. That difference matters and is worth noticing.', tips:['Reach out to one person you trust.','Choose depth over volume in your interactions.','Let yourself be a little more honest than usual with someone safe.'], note:'If loneliness is becoming a pattern, talking with a therapist can help unpack what is making connection harder.'},
      low:{label:'Feeling Isolated', color:'#ba7670', body:'Your responses suggest loneliness or disconnection may be weighing on you. That pain can feel invisible from the outside, but it is still significant.', tips:['Start with one small point of contact instead of trying to fix everything.','Consider a recurring group, class, or shared activity.','Use the diary to write the truth of how alone this feels.'], note:'Persistent loneliness can have a major impact on wellbeing. Support from a therapist or counsellor may help.'}
    },
    self:{
      high:{label:'Self-Compassion Present', color:'#74a87f', body:'There is some gentleness in the way you are relating to yourself. That is not weakness; it is one of the foundations of resilience.', tips:['Keep noticing moments when you are fair to yourself.','Speak to yourself the way you would speak to someone you love.','Let rest and kindness count as real forms of progress.'], note:null},
      mid:{label:'Mixed Self-View', color:'#b39b63', body:'You may be moving between self-kindness and self-criticism right now. That tension is common, but it still deserves attention.', tips:['Catch one harsh thought and rewrite it more fairly.','Notice how often exhaustion makes your inner voice sharper.','Use the diary to respond to yourself with more honesty and care.'], note:'If self-criticism is persistent or deeply painful, therapy can be very effective here.'},
      low:{label:'Harsh Inner Voice', color:'#ba7670', body:'Your answers suggest you may be carrying a heavy amount of self-criticism. That kind of inner pressure is exhausting and can affect every part of life.', tips:['Keep the bar for today small and compassionate.','Write down three things you did well enough.','Challenge the idea that harshness is what keeps you going.'], note:'Low self-worth and persistent self-criticism are very treatable with the right support.'}
    }
  };

  function loadJSON(key, fallback){
    try{
      var value = JSON.parse(localStorage.getItem(key));
      return value && typeof value === 'object' ? value : fallback;
    }catch(e){
      return fallback;
    }
  }

  function setTheme(theme){
    root.setAttribute('data-theme', theme);
    themeLbl.textContent = theme === 'dark' ? 'Dark' : 'Light';
    try{ localStorage.setItem('bth_theme', theme); }catch(e){}
  }

  setTheme(localStorage.getItem('bth_theme') || 'dark');
  themeCtrl.addEventListener('click', function(){
    setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  function band(score){
    return score >= 70 ? 'high' : score >= 35 ? 'mid' : 'low';
  }

  function scoreTopics(){
    var totals = {};
    var counts = {};
    QUESTIONS.forEach(function(question){
      var raw = responses[question.id] !== undefined ? Number(responses[question.id]) : 50;
      var adjusted = question.inv ? 100 - raw : raw;
      totals[question.topic] = (totals[question.topic] || 0) + adjusted;
      counts[question.topic] = (counts[question.topic] || 0) + 1;
    });
    var scores = {};
    ORDER.forEach(function(topic){
      scores[topic] = counts[topic] ? Math.round(totals[topic] / counts[topic]) : 50;
    });
    return scores;
  }

  function topicSentence(topic, score){
    if(score >= 70){ return META[topic].label + ' seems to be a steadier area for you right now.'; }
    if(score >= 35){ return META[topic].label + ' looks mixed and may need a little more attention.'; }
    return META[topic].label + ' seems to be carrying more strain right now.';
  }

  var scores = scoreTopics();
  var sorted = ORDER.slice().sort(function(a, b){ return scores[b] - scores[a]; });
  var strongest = sorted[0];
  var hardest = sorted[sorted.length - 1];
  var average = Math.round(ORDER.reduce(function(total, topic){ return total + scores[topic]; }, 0) / ORDER.length);
  var anyLow = ORDER.some(function(topic){ return scores[topic] < 25; });

  document.getElementById('title').textContent = 'Here’s your check-in, ' + name + '.';
  document.getElementById('subtitle').textContent = 'These reflections respond to the answers you gave today, so your steadier areas and harder areas are both visible.';

  summaryMain.innerHTML =
    '<strong>' + META[strongest].label + '</strong> looks like your strongest support right now, while <strong>' + META[hardest].label + '</strong> may need the most care. ' +
    topicSentence(strongest, scores[strongest]) + ' ' + topicSentence(hardest, scores[hardest]);

  [
    {title:'Strongest support', body:META[strongest].label + ' scored ' + scores[strongest] + '/100.'},
    {title:'Most tender area', body:META[hardest].label + ' scored ' + scores[hardest] + '/100.'},
    {title:'Overall snapshot', body:'Your average check-in score today was ' + average + '/100.'}
  ].forEach(function(item){
    var div = document.createElement('div');
    div.className = 'insight';
    div.innerHTML = '<h3>' + item.title + '</h3><p>' + item.body + '</p>';
    insightsEl.appendChild(div);
  });

  ORDER.forEach(function(topic, index){
    var score = scores[topic];
    var content = CONTENT[topic][band(score)];
    var meta = META[topic];
    var card = document.createElement('article');
    card.className = 'card';
    card.style.animationDelay = (index * 90) + 'ms';
    var tipsHTML = content.tips.map(function(tip){ return '<div class="tip">' + tip + '</div>'; }).join('');
    var noteHTML = content.note ? '<div class="note">' + content.note + '</div>' : '';
    card.innerHTML =
      '<div class="card-head">' +
        '<div class="card-title-wrap">' +
          '<div class="card-label">' + meta.icon + ' ' + meta.label + '</div>' +
          '<div class="card-state" style="color:' + content.color + '">' + content.label + '</div>' +
        '</div>' +
        '<div class="score">' + score + '/100</div>' +
      '</div>' +
      '<div class="bar-wrap"><div class="bar" data-width="' + score + '" style="background:' + content.color + '"></div></div>' +
      '<p class="body">' + content.body + '</p>' +
      '<div class="mini-head">What may help next</div>' +
      '<div class="tips">' + tipsHTML + '</div>' +
      noteHTML;
    cardsEl.appendChild(card);
  });

  setTimeout(function(){
    document.querySelectorAll('.bar').forEach(function(bar){
      bar.style.width = bar.getAttribute('data-width') + '%';
    });
  }, 180);

  if(anyLow){
    supportBox.hidden = false;
    supportBox.innerHTML = '<strong>A gentle note:</strong> One or more areas look especially strained today. If things feel overwhelming, persistent, or unsafe, reaching out to a mental health professional, local crisis line, or emergency support is a strong next step.';
  }

  if(average >= 70){
    closing.textContent = 'There is more steadiness here than you may be giving yourself credit for, ' + name + '.';
  }else if(average >= 35){
    closing.textContent = 'You do not have to be all the way okay to be making it through, ' + name + '.';
  }else{
    closing.textContent = 'Thank you for answering honestly today, ' + name + '. Please be extra gentle with yourself.';
  }

  function nav(url){
    document.body.classList.add('page-exit');
    setTimeout(function(){ window.location.href = url; }, 540);
  }

  document.getElementById('diaryBtn').addEventListener('click', function(){ nav('diary.html'); });
  document.getElementById('retakeBtn').addEventListener('click', function(){ nav('questions.html'); });
  document.getElementById('downloadBtn').addEventListener('click', function(){
    var lines = [
      'BREATHE — Reflection Results',
      'Date: ' + new Date().toLocaleDateString(),
      'Name: ' + name,
      '',
      'Summary:',
      summaryMain.textContent,
      ''
    ];

    ORDER.forEach(function(topic){
      var score = scores[topic];
      var content = CONTENT[topic][band(score)];
      lines.push(META[topic].label + ' — ' + content.label + ' (' + score + '/100)');
      lines.push(content.body);
      content.tips.forEach(function(tip){ lines.push('- ' + tip); });
      if(content.note){ lines.push('Note: ' + content.note); }
      lines.push('');
    });

    if(!supportBox.hidden){ lines.push(supportBox.textContent, ''); }
    lines.push(closing.textContent, '', 'This is a reflection tool, not a medical diagnosis.');

    var blob = new Blob([lines.join('\n')], {type:'text/plain'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'breathe-results-' + new Date().toISOString().slice(0, 10) + '.txt';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });
})();
</script>
</body>
</html>
