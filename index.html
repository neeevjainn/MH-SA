<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Breathe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@300;400&display=swap');
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #0f0f0f;
    color: #eee;
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
 
  /* each screen */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  .screen.show { display: flex; }
 
  .big-word {
    font-family: 'Caveat', cursive;
    font-size: 120px;
    line-height: 1;
  }
 
  .tagline {
    font-family: 'Caveat', cursive;
    font-size: 36px;
    color: #aaa;
  }
 
  .hint {
    font-size: 13px;
    color: #666;
    margin-bottom: 4px;
  }
 
  input {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px 20px;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: #eee;
    text-align: center;
    outline: none;
    width: 240px;
  }
  input:focus { border-color: #666; }
 
  button {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 24px;
    color: #aaa;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #222; color: #eee; }
 
  .note {
    position: fixed;
    bottom: 20px;
    font-size: 11px;
    color: #444;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }
</style>
</head>
<body>
 
  <div class="screen show" id="s1">
    <span class="big-word">Hi.</span>
  </div>
 
  <div class="screen" id="s2">
    <p class="tagline">Take a breath.<br>We're here to help.</p>
  </div>
 
  <div class="screen" id="s3">
    <p class="hint">What do we call you?</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="30" />
    <button id="goBtn">Let's go →</button>
  </div>
 
  <p class="note">This is a self-reflection tool, not a medical diagnosis. Your answers never leave your device.</p>
 
<script>
  var s1 = document.getElementById('s1');
  var s2 = document.getElementById('s2');
  var s3 = document.getElementById('s3');
  var nameInput = document.getElementById('nameInput');
 
  var prev = localStorage.getItem('bth_name');
  if (prev && prev !== 'friend') nameInput.value = prev;
 
  setTimeout(function() { s1.classList.remove('show'); s2.classList.add('show'); }, 2000);
  setTimeout(function() { s2.classList.remove('show'); s3.classList.add('show'); nameInput.focus(); }, 4500);
 
  function go() {
    var name = nameInput.value.trim() || 'friend';
    localStorage.setItem('bth_name', name);
    window.location.href = 'questions.html';
  }
 
  document.getElementById('goBtn').addEventListener('click', go);
  nameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
