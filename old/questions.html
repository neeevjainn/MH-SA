<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Questions — Breathe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400&display=swap');
:root{--bg:#0e0e0e;--bg2:#141414;--surface:#1c1c1c;--surface2:#242424;--border:#2c2c2c;--border2:#3a3a3a;--text:#f0ede8;--text2:#b0aca6;--muted:#585858;--accent:#e8e0d4;--font-display:'Caveat',cursive;--font-body:'Lora',serif;--font-ui:'DM Sans',sans-serif;--pill:999px;--radius:16px;--dur:0.6s;}
[data-theme="light"]{--bg:#f4f1ec;--bg2:#ede9e3;--surface:#e6e1da;--surface2:#ddd8d0;--border:#ccc7bf;--border2:#b5b0a8;--text:#1c1a17;--text2:#56524d;--muted:#9a9590;--accent:#3a3530;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);overflow:hidden;transition:background var(--dur),color var(--dur);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:0.028;}
/* theme */
.theme-ctrl{position:fixed;top:22px;right:26px;z-index:600;display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
.theme-lbl{font-family:var(--font-ui);font-size:10px;font-weight:300;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;transition:color var(--dur);}
.tog{position:relative;width:42px;height:22px;background:var(--surface2);border-radius:var(--pill);border:1px solid var(--border2);transition:background var(--dur),border-color var(--dur);}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--muted);border-radius:50%;transition:transform .35s cubic-bezier(.4,0,.2,1),background var(--dur);}
[data-theme="light"] .tog::after{transform:translateX(20px);background:var(--text2);}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 26px;border-radius:var(--pill);font-family:var(--font-ui);font-size:13px;font-weight:300;letter-spacing:.04em;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:background .2s,color .2s,transform .15s;white-space:nowrap;}
.btn:hover{background:var(--surface2);color:var(--text);}
.btn:active{transform:scale(.97);}
/* page anim */
@keyframes swipeUp{from{opacity:0;transform:translateY(55px)}to{opacity:1;transform:translateY(0)}}
@keyframes swipeDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-55px)}}
.pg-enter{animation:swipeUp .65s cubic-bezier(.4,0,.2,1) forwards;}
.pg-exit{animation:swipeDown .65s cubic-bezier(.4,0,.2,1) forwards;}
/* layout */
.shell{position:fixed;inset:0;display:flex;flex-direction:column;}
.prog-bar{height:2px;background:var(--border);flex-shrink:0;}
.prog-fill{height:100%;background:var(--text2);border-radius:var(--pill);transition:width .6s cubic-bezier(.4,0,.2,1),background var(--dur);}
.q-head{padding:20px 32px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topic-tag{font-family:var(--font-ui);font-size:10px;font-weight:300;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;transition:color var(--dur);}
.q-num{font-family:var(--font-ui);font-size:10px;font-weight:300;color:var(--muted);letter-spacing:.06em;}
/* stage */
.stage{flex:1;position:relative;overflow:hidden;}
/* card */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 48px;opacity:0;pointer-events:none;transform:translateY(50px);transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1);}
.card.active{opacity:1;pointer-events:all;transform:translateY(0);}
.card.exit{opacity:0;transform:translateY(-50px);pointer-events:none;}
.q-text{font-family:var(--font-display);font-size:clamp(22px,3.8vw,42px);font-weight:400;text-align:center;line-height:1.35;color:var(--text);max-width:580px;margin-bottom:52px;transition:color var(--dur);}
/* slider */
.sl-wrap{width:min(520px,90vw);display:flex;flex-direction:column;gap:14px;}
.track-box{position:relative;}
.track-grad{position:absolute;top:50%;left:0;right:0;height:2px;transform:translateY(-50%);background:linear-gradient(to right,#c47a7a,var(--border2) 50%,#6aaa7e);border-radius:var(--pill);opacity:.4;pointer-events:none;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--border2);border-radius:var(--pill);outline:none;cursor:pointer;position:relative;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--text);border:2.5px solid var(--bg);box-shadow:0 0 0 1.5px var(--border2);transition:transform .2s,background var(--dur);cursor:grab;}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.25);}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--text);border:2.5px solid var(--bg);box-shadow:0 0 0 1.5px var(--border2);cursor:grab;}
.sl-labels{display:flex;justify-content:space-between;}
.sl-labels span{font-family:var(--font-ui);font-size:10px;font-weight:300;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;}
/* feedback */
.fb{margin:0 32px 12px;padding:13px 22px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-family:var(--font-display);font-size:18px;color:var(--text2);text-align:center;min-height:50px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s,background var(--dur),color var(--dur);flex-shrink:0;}
.fb.on{opacity:1;transform:translateY(0);}
/* footer */
.q-foot{padding:0 32px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
</style>
</head>
<body class="pg-enter">

<div class="theme-ctrl" id="themeCtrl">
  <span class="theme-lbl" id="themeLbl">Dark</span>
  <div class="tog"></div>
</div>

<div class="shell">
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="q-head">
    <span class="topic-tag" id="topicTag">—</span>
    <span class="q-num" id="qNum">1 / 12</span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="fb" id="fb"></div>
  <div class="q-foot">
    <button class="btn" id="prevBtn">&larr; Back</button>
    <button class="btn" id="nextBtn">Next &rarr;</button>
  </div>
</div>

<script>
(function(){
  // theme
  var root = document.documentElement;
  var lbl  = document.getElementById('themeLbl');
  var ctrl = document.getElementById('themeCtrl');
  var th   = localStorage.getItem('bth_theme') || 'dark';
  root.setAttribute('data-theme', th);
  lbl.textContent = th === 'dark' ? 'Dark' : 'Light';
  ctrl.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem('bth_theme', next);
    lbl.textContent = next === 'dark' ? 'Dark' : 'Light';
  });

  // data
  var QUESTIONS = [
    {id:'q1', topic:'mood',    text:'I have felt hopeful about the future recently.',          inv:false},
    {id:'q2', topic:'mood',    text:'I have been feeling low or empty without knowing why.',   inv:true },
    {id:'q3', topic:'mood',    text:'Small things have been bringing me joy lately.',           inv:false},
    {id:'q4', topic:'anxiety', text:'I have felt calm and at ease in my daily life.',           inv:false},
    {id:'q5', topic:'anxiety', text:'My mind has been racing with worries I cannot control.',  inv:true },
    {id:'q6', topic:'anxiety', text:'I have been able to relax when I needed to.',             inv:false},
    {id:'q7', topic:'sleep',   text:'I have been waking up feeling rested and restored.',      inv:false},
    {id:'q8', topic:'sleep',   text:'I have struggled to fall or stay asleep recently.',       inv:true },
    {id:'q9', topic:'social',  text:'I have felt genuinely connected to people around me.',    inv:false},
    {id:'q10',topic:'social',  text:'I have felt lonely or isolated, even around others.',     inv:true },
    {id:'q11',topic:'self',    text:'I have been kind and patient with myself.',               inv:false},
    {id:'q12',topic:'self',    text:'I have been critical of myself more than I deserve.',     inv:true },
  ];
  var TOPICS = {
    mood:    {label:'Emotional Wellbeing', icon:'\uD83C\uDF24'},
    anxiety: {label:'Anxiety & Stress',    icon:'\uD83C\uDF0A'},
    sleep:   {label:'Sleep & Energy',      icon:'\uD83C\uDF19'},
    social:  {label:'Connection',          icon:'\uD83E\uDD1D'},
    self:    {label:'Self-Worth',          icon:'\uD83C\uDF31'},
  };
  var FB_HIGH = ["That's really good to hear.", "Hold onto that feeling — it matters.", "You're doing better than you think.", "That warmth in you is real.", "That counts for a lot."];
  var FB_MID  = ["Somewhere in the middle is honest.", "It's okay not to be certain.", "That ambivalence is valid.", "You don't have to have it all figured out.", "In-between is a real place to be."];
  var FB_LOW  = ["Thank you for being honest with yourself.", "That takes courage to acknowledge.", "You're not alone in feeling this way.", "Naming it is the first step.", "It's okay. You're still here, and that matters."];

  function getFB(v){ var p = v>=65?FB_HIGH:v>=35?FB_MID:FB_LOW; return p[Math.floor(Math.random()*p.length)]; }

  var responses = (function(){ try{ return JSON.parse(localStorage.getItem('bth_resp'))||{}; }catch(e){return {};} })();
  var stage     = document.getElementById('stage');
  var progFill  = document.getElementById('progFill');
  var topicTag  = document.getElementById('topicTag');
  var qNum      = document.getElementById('qNum');
  var prevBtn   = document.getElementById('prevBtn');
  var nextBtn   = document.getElementById('nextBtn');
  var fbEl      = document.getElementById('fb');
  var fbTimer   = null;
  var cur       = 0;

  // build cards
  QUESTIONS.forEach(function(q, i){
    var card = document.createElement('div');
    card.className = 'card' + (i===0 ? ' active' : '');
    card.id = 'c'+i;
    var val = (responses[q.id] !== undefined) ? responses[q.id] : 50;
    card.innerHTML =
      '<p class="q-text">'+q.text+'</p>'+
      '<div class="sl-wrap">'+
        '<div class="track-box">'+
          '<div class="track-grad"></div>'+
          '<input type="range" min="0" max="100" value="'+val+'" id="sl'+i+'" />'+
        '</div>'+
        '<div class="sl-labels"><span>Strongly Disagree</span><span>Strongly Agree</span></div>'+
      '</div>';
    stage.appendChild(card);

    var sl = card.querySelector('input');
    sl.addEventListener('input', function(){
      var v = parseInt(sl.value);
      responses[q.id] = v;
      try{ localStorage.setItem('bth_resp', JSON.stringify(responses)); }catch(e){}
      // feedback uses display value (agree = right, always)
      clearTimeout(fbTimer);
      fbEl.textContent = getFB(q.inv ? 100-v : v);
      fbEl.classList.add('on');
      fbTimer = setTimeout(function(){ fbEl.classList.remove('on'); }, 3200);
    });
  });

  function updateUI(){
    var q = QUESTIONS[cur];
    var t = TOPICS[q.topic];
    topicTag.textContent = t.icon + '  ' + t.label;
    qNum.textContent = (cur+1) + ' / ' + QUESTIONS.length;
    progFill.style.width = (((cur+1)/QUESTIONS.length)*100) + '%';
    prevBtn.style.opacity = cur===0 ? '0.3' : '1';
    prevBtn.style.pointerEvents = cur===0 ? 'none' : 'auto';
    nextBtn.textContent = cur===QUESTIONS.length-1 ? 'See Results \u2192' : 'Next \u2192';
  }

  function goTo(newIdx, dir){
    var oldCard = document.getElementById('c'+cur);
    var newCard = document.getElementById('c'+newIdx);
    oldCard.classList.remove('active');
    oldCard.classList.add('exit');
    setTimeout(function(){ oldCard.classList.remove('exit'); }, 650);
    if(dir === 'back'){
      newCard.style.cssText = 'opacity:0;transform:translateY(-50px);transition:none;';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          newCard.style.cssText = '';
          newCard.classList.add('active');
        });
      });
    } else {
      newCard.classList.add('active');
    }
    cur = newIdx;
    updateUI();
    fbEl.classList.remove('on');
  }

  nextBtn.addEventListener('click', function(){
    if(cur < QUESTIONS.length-1){
      goTo(cur+1,'forward');
    } else {
      try{ localStorage.setItem('bth_resp', JSON.stringify(responses)); }catch(e){}
      document.body.classList.add('pg-exit');
      setTimeout(function(){ window.location.href='results.html'; }, 620);
    }
  });
  prevBtn.addEventListener('click', function(){
    if(cur>0) goTo(cur-1,'back');
  });

  // swipe
  var ty0 = 0;
  stage.addEventListener('touchstart', function(e){ ty0=e.touches[0].clientY; },{passive:true});
  stage.addEventListener('touchend', function(e){
    var d = ty0 - e.changedTouches[0].clientY;
    if(Math.abs(d)>50){
      if(d>0 && cur<QUESTIONS.length-1) goTo(cur+1,'forward');
      if(d<0 && cur>0) goTo(cur-1,'back');
    }
  });

  updateUI();
})();
</script>
</body>
</html>
